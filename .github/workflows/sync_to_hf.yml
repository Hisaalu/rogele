name: Sync to Hugging Face Hub
on:
  push:
    branches: [VPC]  # 1. GitHub will now watch your VPC branch
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # 2. This maps your local 'VPC' branch to the remote Hugging Face 'main' branch
        run: git push --force https://hisaalunelson:$HF_TOKEN@huggingface.co/spaces/hisaalunelson/ROGELE VPC:main